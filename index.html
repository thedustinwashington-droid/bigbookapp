<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Book Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="card header-card">
        <h1>Big Book Search</h1>
        <p class="subtext">Search the text of Alcoholics Anonymous (Big Book) in a clean mobile-friendly app.</p>
      </header>

      <section class="card" id="sobriety-card">
        <h2>Sobriety</h2>
        <form id="sobriety-form" class="row-form">
          <label for="sobriety-date">Sobriety date</label>
          <input id="sobriety-date" name="sobriety-date" type="date" required />
          <button type="submit">Save Date</button>
        </form>
        <p id="sobriety-output" class="highlight-message">Set your date to see your sober time.</p>
      </section>

      <section class="card" id="search-card">
        <h2>Search Big Book</h2>
        <p class="subtext">Text source: <a href="https://www.portlandeyeopener.com/AA-BigBook-4th-Edition.pdf" target="_blank" rel="noopener noreferrer">AA Big Book PDF</a>.</p>
        <div class="search-box">
          <label for="search-input">Word or phrase</label>
          <input id="search-input" type="search" autocomplete="off" placeholder="Try: honesty, resentment, spiritual awakening" />
          <ul id="suggestions" class="suggestions" aria-label="Search suggestions"></ul>
          <button id="search-button" type="button">Search</button>
        </div>
        <p id="index-status" class="subtext">Preparing searchable index…</p>
        <div id="results" class="results"></div>
      </section>

      <section class="card hidden" id="detail-card">
        <button id="back-to-results" class="link-button" type="button">← Back to results</button>
        <h2 id="detail-title">Result</h2>
        <article id="detail-content"></article>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
